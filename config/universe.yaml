# =============================================================================
# universe.yaml — tradable universes, sector groups for pairs, wheel whitelist.
#
# MAINTAINED BY THE STRATEGY OWNER. The system reads this file; it never
# rewrites it. `scripts/refresh_universe.py` can PRINT a proposed diff against
# the live NSE index constituent lists, but applying it is a human decision.
#
# `as_of` matters: index constituents change at every semi-annual rebalance,
# and a backtest run against a stale list has survivorship bias.
# =============================================================================

meta:
  as_of: "2026-07-22"
  source: "NSE index constituent files (manually reviewed)"
  note: >
    NIFTY100 = NIFTY50 + nifty_next_50. NIFTY200 = NIFTY100 + nifty_midcap_100.
    NIFTY500 is resolved at runtime from the instruments cache when
    `nifty500_from_instruments: true`, because maintaining 500 tickers by hand
    is error-prone. Set it false and populate `nifty500_explicit` to pin it.

nifty500_from_instruments: true
nifty500_explicit: []

