# -----------------------------------------------------------------------------
# §6.8 WHEEL — approved names only.
# Spec says 2-3 liquid large-cap F&O names. These are stocks the owner is
# genuinely willing to take DELIVERY of, because stock options settle
# physically (§8.5). Do not add a name here you would not want to own.
# -----------------------------------------------------------------------------
wheel_approved:
  - symbol: RELIANCE
    max_lots: 1
    willing_to_own: true
  - symbol: INFY
    max_lots: 1
    willing_to_own: true
  - symbol: ITC
    max_lots: 1
    willing_to_own: true

# -----------------------------------------------------------------------------
