# -----------------------------------------------------------------------------
# §6.3 PAIRS — sector groups, NIFTY-50 only.
# `refresh_pairs.py` runs Engle-Granger within each group and stores the
# surviving pairs (p < 0.05) plus their hedge ratios in the journal DB.
# Only same-sector pairs are ever tested: cross-sector cointegration on a
# 1-year window is usually spurious.
# -----------------------------------------------------------------------------
pair_sectors:
  banks_private:
    - HDFCBANK
    - ICICIBANK
    - AXISBANK
    - KOTAKBANK
    - INDUSINDBK
  banks_psu_and_nbfc:
    - SBIN
    - BAJFINANCE
    - BAJAJFINSV
    - SHRIRAMFIN
    - JIOFIN
  it:
    - TCS
    - INFY
    - HCLTECH
    - WIPRO
    - TECHM
