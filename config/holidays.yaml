# =============================================================================
# holidays.yaml — NSE trading holidays and Muhurat sessions.
#
# Read by core/calendar.py. NOT hardcoded in Python (§8.3 principle: exchange
# schedules change and the owner maintains them).
#
# Source of truth: NSE "Trading Holidays" circular, published annually, plus
# the live `/api/holiday-master?type=trading` endpoint which
# `scripts/refresh_holidays.py` can diff against this file.
#
# `settlement_only` days (e.g. clearing holidays) are NOT listed here — only
# days on which the equity segment does not trade.
# =============================================================================

meta:
  as_of: "2026-07-22"
  verified_against_nse: false
  note: >
    Run `python scripts/refresh_holidays.py --check` after Phase 2 to diff this
    file against NSE's holiday-master endpoint. Until `verified_against_nse`
    is true, calendar.py logs a WARNING once per process so a stale list can
    never silently corrupt a backtest.

# Muhurat Trading: a special ~1 hour evening session on Diwali. The market is
# otherwise closed that day. Engines are disabled for Muhurat by default —
# it is a ceremonial session with abnormal liquidity.
muhurat:
  trade_engines: false
  sessions:
    - date: "2025-10-21"
      start: "13:45"
      end: "14:45"
    - date: "2026-11-08"
      start: "18:15"
      end: "19:15"
      provisional: true

